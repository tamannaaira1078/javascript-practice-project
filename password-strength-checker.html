<!DOCTYPE html>
<html>
  <head>
    <title>Password Strength Checker</title>

    <style>
      .progress-track{
      width: 100px;
      height: 12px;
      background-color: lightgrey;
      border-radius: 10px;
      overflow:hidden;
    }

    .progress-fill1,
    .progress-fill2,
    .progress-fill3 

     {
      width:100%;
      height: 100%;
      background-color:green ;
      border-radius: 10px;
    }


  .progress-info {
    display: flex;
    justify-content: flex-start;
    gap:8px;
    align-items: center;
  }

   .character-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width:300px;
      margin-bottom: 10px;
    }
    
    .text-input,
    .button-element{
      border: solid 1px black;
      border-radius: 10px;
      padding: 8px 8px;
    }

    .main-features{
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap:4px;

    }
    </style>
  </head>
  <body>
    <div class="main-features">
      
      <input type="password" class="text-input" placeholder="Type Your Password">
    
    <button type="button" class="button-element js-button-element">show</button>

    </div>
    
    <div class="character-info"> 
    <div class="character-message"></div>
    <div class="character-count">0</div>
  </div>
    <div class="progress-info">
      
  <div class="progress-track">
    <div class="progress-fill1"></div>
  </div>
  <div class="progress-track">
    <div class="progress-fill2"></div>
  </div>
  <div class="progress-track">
    <div class="progress-fill3"></div>
  </div>
    </div>
     

  <script>
    const input = document.querySelector('.text-input');
    const counter = document.querySelector('.character-count');
    const message = document.querySelector('.character-message');
    const bar1 = document.querySelector('.progress-fill1');

    const bar2 = document.querySelector('.progress-fill2');
    const bar3 = document.querySelector('.progress-fill3');
    const buttonElement= document.querySelector('.js-button-element');


    updatePasswordStrength()

    function updatePasswordStrength() {
      const characterCount = input.value.length;
      counter.textContent =`${characterCount} Characters`

      if (characterCount===0) {
        message.textContent = 'Enter a password'; 
        bar1.style.backgroundColor ="transparent";
        bar2.style.backgroundColor ="transparent";
        bar3.style.backgroundColor ="transparent";
      } else if (characterCount<=5) {
        message.textContent = 'Weak Password'; 
        bar1.style.backgroundColor ="red";
        bar2.style.backgroundColor ="transparent";
        bar3.style.backgroundColor ="transparent";

      }
       else if (characterCount <10) {
        message.textContent = 'Medium Password'; 
        bar1.style.backgroundColor ="orange";
        bar2.style.backgroundColor ="orange";
        bar3.style.backgroundColor ="transparent";
      } else {
        message.textContent = 'Strong Password';
        bar1.style.backgroundColor ="green";
        bar2.style.backgroundColor ="green";
        bar3.style.backgroundColor ="green"; 
      }

    }

    input.addEventListener('input', ()=>{

    updatePasswordStrength()
      
    })
   
    buttonElement.addEventListener('click', ()=>{
      
      
      if (input.type==="password") {
        input.type="text";
        buttonElement.textContent="hide";
      } else if (input.type==="text") {
        input.type="password"
        buttonElement.textContent="show";
      }
      
    })
  </script>
  </body>
</html>
