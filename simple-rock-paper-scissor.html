<!DOCTYPE html>
<html>


  <head>
    <title>Rock Paper Scissors</title>
    <style>
      .rock {
        font-family:Arial, Helvetica, sans-serif;
        font-size: 30px;
        background-color: palevioletred;
        color: antiquewhite;
        padding-top: 4px;
        padding-bottom: 4px;
        padding-left: 8px;
        padding-right: 8px;
        border: solid 4px;
        border-color: rgb(240, 136, 199);
        border-radius: 16px;

      }

      .paper {
        font-family:Arial, Helvetica, sans-serif;
        font-size: 30px;
        background-color: rgb(59, 191, 235);
        color: black;
        padding-top: 4px;
        padding-bottom: 4px;
        padding-left: 8px;
        padding-right: 8px;
        border:solid 4px;
        border-color:burlywood;
        border-radius: 16px;

      }

      .scissors {
        font-family:Arial, Helvetica, sans-serif;
        font-size: 30px;
        background-color: rgb(59, 235, 65);
        color: rgb(244, 20, 20);
        padding-top: 4px;
        padding-bottom: 4px;
        padding-left: 8px;
        padding-right: 8px;
        border:solid 4px;
        border-color:rgb(184, 253, 185);
        border-radius: 16px;

      }
    </style>
  </head>

  <body>

    <h1> Simple Rock Paper Scissors</h1>

    <button class="rock" onclick="
       const randomNumber = Math.random();
        let ComputerMove= '';

       if (randomNumber>=0  &&randomNumber <1/3) {
          ComputerMove = 'rock';
       } else if  (randomNumber>=1/3 && randomNumber <2/3) {
        ComputerMove ='paper';
       } else if (randomNumber >=2/3 && randomNumber <=1) {
         ComputerMove ='scissors';
       }
       
       let result = '';

       if (ComputerMove==='rock') {
        result ='Tie';
       } else if (ComputerMove=== 'scissors') {
        result = 'Win';
       } else if (ComputerMove=== 'paper')  {
        result='Lose';
       }
       alert(`You picked rock. Computer picked ${ComputerMove}.${result}`);
    ">Rock</button>


    <button class="paper" onclick="
        let ComputerMove1 = '';
        const RandomNumber = Math.random();
        if (RandomNumber>=0 && RandomNumber <1/3) {
          ComputerMove1= 'rock';
        } else if (RandomNumber>=1/3 && RandomNumber < 2/3) {
          ComputerMove1= 'paper';
        } else if (RandomNumber>=2/3 && RandomNumber <=1) {
          ComputerMove1= 'scissors'
        }

        let result1= '';
        if (ComputerMove1==='rock') {
          result1 = 'Win';
        } else if (ComputerMove1=='paper') {
          result1 = 'Tie'
        } else if (ComputerMove1==='scissors') {
          result1= 'Lose'
        }

        alert(`You picked Paper. Computer picked ${ComputerMove1}.${result1}`)

    
    ">Paper</button>


    <button class="scissors" onclick="
        let ComputerMove2 = '';
        const RandomNumber2 = Math.random();
        if (RandomNumber2>=0 && RandomNumber2 <1/3) {
          ComputerMove2= 'rock';
        } else if (RandomNumber2>=1/3 && RandomNumber2 < 2/3) {
          ComputerMove2= 'paper';
        } else if (RandomNumber2>=2/3 && RandomNumber2 <=1) {
          ComputerMove2= 'scissors'
        }

        let result2= '';
        if (ComputerMove2==='rock') {
          result2 = 'Lose';
        } else if (ComputerMove2=='paper') {
          result2 = 'Win';
        } else if (ComputerMove2==='scissors') {
          result2= 'Tie';
        }

        alert(`You picked Scissor. Computer picked ${ComputerMove2}.${result2}`)
    
    ">Scissors </button>
    <script></script>
  </body>
</html>
