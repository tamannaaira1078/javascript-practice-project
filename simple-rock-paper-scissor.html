<!DOCTYPE html>
<html>


<head>
  <title>Rock Paper Scissors</title>
  <style>
    .rock {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      background-color: palevioletred;
      color: antiquewhite;
      padding-top: 4px;
      padding-bottom: 4px;
      padding-left: 8px;
      padding-right: 8px;
      border: solid 4px;
      border-color: rgb(240, 136, 199);
      border-radius: 16px;

    }

    .paper {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      background-color: rgb(59, 191, 235);
      color: black;
      padding-top: 4px;
      padding-bottom: 4px;
      padding-left: 8px;
      padding-right: 8px;
      border: solid 4px;
      border-color: burlywood;
      border-radius: 16px;

    }

    .scissors {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      background-color: rgb(59, 235, 65);
      color: rgb(244, 20, 20);
      padding-top: 4px;
      padding-bottom: 4px;
      padding-left: 8px;
      padding-right: 8px;
      border: solid 4px;
      border-color: rgb(184, 253, 185);
      border-radius: 16px;

    }

    .reset-button {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      background-color: lightcoral;
      color: black;
      padding-top: 4px;
      padding-bottom: 4px;
      padding-left: 8px;
      padding-right: 8px;
      border: solid 4px;
      border-color: rgb(194, 227, 242);
      border-radius: 16px;

    }
  </style>
</head>

<body>

  <h1> Simple Rock Paper Scissors</h1>

  <button class="rock" onclick="
      playGame('rock')
       
    ">Rock</button>


  <button class="paper" onclick="

      playGame('paper')

    
    ">Paper</button>


  <button class="scissors" onclick="
        playGame('scissors')
          
    
    ">Scissors </button>

  <button class="reset-button" onclick="
    score.wins=0;
    score.losses=0;
    score.ties=0;
    localStorage.removeItem('score');
  ">Reset Score</button>



  <script>

    let score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0,
      ties: 0
    };

    /*
    if (!score)  {
    score = {
      wins:0,
      losses:0,
      ties:0
    
    }
    
  }
   */


    function playGame(playerMove) {
      const ComputerMove = pickComputerMove();

      let result = '';
      if (playerMove === 'scissors') {
        if (ComputerMove === 'rock') {
          result = 'Lose';
        } else if (ComputerMove == 'paper') {
          result = 'Win';
        } else if (ComputerMove === 'scissors') {
          result = 'Tie';
        }

      } else if (playerMove === 'rock') {
        if (ComputerMove === 'rock') {
          result = 'Tie';
        } else if (ComputerMove === 'scissors') {
          result = 'Win';
        } else if (ComputerMove === 'paper') {
          result = 'Lose';
        }

      } else if (playerMove === 'paper') {
        if (ComputerMove === 'rock') {
          result = 'Win';
        } else if (ComputerMove == 'paper') {
          result = 'Tie'
        } else if (ComputerMove === 'scissors') {
          result = 'Lose'
        }

      }

      if (result === 'Win') {
        score.wins += 1;
      } else if (result === 'Lose') {
        score.losses += 1;
      } else if (result === 'Tie') {
        score.ties += 1;
      }

      localStorage.setItem('score', 'JSON.stringify(score)');

      alert(`You picked ${playerMove}. Computer picked ${ComputerMove}. You ${result}
      Wins:${score.wins}, Losses:${score.losses}, Ties:${score.ties}`)

    }

    function pickComputerMove() {
      let ComputerMove = '';

      const RandomNumber = Math.random();
      if (RandomNumber >= 0 && RandomNumber < 1 / 3) {
        ComputerMove = 'rock';
      } else if (RandomNumber >= 1 / 3 && RandomNumber < 2 / 3) {
        ComputerMove = 'paper';
      } else if (RandomNumber >= 2 / 3 && RandomNumber <= 1) {
        ComputerMove = 'scissors'
      }


      return ComputerMove;
    }
  </script>
</body>

</html>
