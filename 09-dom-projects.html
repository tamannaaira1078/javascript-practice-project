<!DOCTYPE html>
<html>

<head>
  <title>
    DOM Project
  </title>
  
  <style>

    body {
      font-family: Arial;
    }

    .subscribe-button {
      border: none;
      background-color: black;
      color:white;
      padding-top:10px;
      padding-bottom: 10px;
      padding-left: 15px;
      padding-right:15px ;
      border-radius:50px ;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 30px;

    }
    .is-subscribed {
      background-color: rgb(240, 240, 240);
      color: black;
    }

    .cost-input {
      font-size: 15px;
      /*padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 10px;
      padding-top: 10px; */
      padding: 10px;
    }

    .calculate-button, 
    .reset-button {
      background-color: green;
      color:white;
      border: none;
      font-size:15px;
      padding:12px 15px;
      cursor: pointer;
    }

  
  </style>
</head>

<body>
  <p>YouTube Subscribe Button</p>
  <button class="js-subscribe-button subscribe-button" onclick="
    subscribe()
    ">Subscribe</button>

    <p>Amazon Shipping Calculator</p>
    <input placeholder="cost of order" class="js-cost-input cost-input"
    onkeydown="
    handleCostKeyDown(event)
    ">
    <button class="calculate-button" onclick="
    CalculateTotal()
    
    " >Calculate</button>
    <button class="reset-button" onclick="
    resetCalculator()
    
    ">Reset</button>
    <p class="js-total-cost"></p>
    <p class="js-reset-message"></p>


  <script>
    function handleCostKeyDown(event) {
      
    if (event.key === 'Enter')  {
      CalculateTotal()
    }

    }

    function CalculateTotal()  {
        document.querySelector('.js-reset-message').innerHTML = '';

       const inputElement = document.querySelector('.js-cost-input')
        let cost =Number(inputElement.value);
        if (cost<40) {
          cost = cost + 10;
        } 
        
        document.querySelector('.js-total-cost').innerHTML= 
        `$${cost}`

    }

    function subscribe() {
      const buttonElement = document.querySelector('.js-subscribe-button');
      if (buttonElement.innerText === 'Subscribe') {
        buttonElement.innerText = 'Subscribed';
        buttonElement.classList.add('is-subscribed');
      } else {
        buttonElement.innerText = 'Subscribe';
        buttonElement.classList.remove('is-subscribed');

      }

    }
    function resetCalculator()  {

     document.querySelector('.js-cost-input').value = '';

     document.querySelector('.js-total-cost').innerHTML = '';
      document.querySelector('.js-reset-message').innerHTML = 'Reset';


    };
    
  </script>
</body>

</html>
